<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | SlamFive</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <style>
      #sf-diag-button{position:fixed;right:8px;top:8px;z-index:10001;padding:8px 12px;border:0;border-radius:6px;background:#123a78;color:#fff;font-weight:bold}
      #sf-diag-panel{display:none;position:fixed;z-index:10000;right:8px;top:48px;width:min(92vw,560px);max-height:78vh;overflow:auto;background:#fff;color:#111;border:2px solid #123a78;border-radius:8px;padding:12px;font:13px/1.45 monospace;white-space:pre-wrap;overflow-wrap:anywhere}
      #sf-diag-panel button{margin:8px 8px 0 0;padding:7px 10px}
    </style>
    <button id="sf-diag-button" type="button">診断</button>
    <div id="sf-diag-panel"><div id="sf-diag-text">診断準備中</div><button id="sf-diag-copy" type="button">診断をコピー</button><button id="sf-diag-close" type="button">閉じる</button></div>
    <script>
      (function(){
        var BUILD_ID="20260911121451",events=[],phase="HTML loaded",lastError="なし";
        // Unity Webの内部ミキサーは44.1kHz基準だが、iPhone SafariはAudioContextを
        // 48kHzで生成する場合がある。復帰・回転後に両者がずれるとBGM/SEがまとめて
        // 約1.09倍速になるため、UnityがAudioContextを作る前に44.1kHzへ固定する。
        var isiOS=/iPhone|iPad|iPod/i.test(navigator.userAgent)||
          (/Macintosh/i.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
        if(isiOS){
          var NativeAudioContext=window.AudioContext||window.webkitAudioContext;
          if(NativeAudioContext){
            var FixedAudioContext=function(){
              try{return new NativeAudioContext({sampleRate:44100});}
              catch(ignore){return new NativeAudioContext();}
            };
            FixedAudioContext.prototype=NativeAudioContext.prototype;
            window.AudioContext=FixedAudioContext;
            window.webkitAudioContext=FixedAudioContext;
          }
        }
        function cut(v,n){v=String(v==null?"":v);return v.length>n?v.slice(0,n)+"…":v;}
        function errorText(value){
          try{
            var type=typeof value,out="type="+type;
            if(type==="number"&&Number.isFinite(value))out+=" value="+value+" hex=0x"+(value>>>0).toString(16);
            else out+=" value="+cut(value&&value.message?value.message:value,1024);
            if(value&&value.name)out+=" name="+cut(value.name,128);
            if(value&&value.stack)out+="\nstack="+cut(value.stack,4096);
            return out;
          }catch(e){return "診断中の例外: "+String(e);}
        }
        function inspectSlot(slot){
          var key="slamfive.snapshot.v4.slot"+slot,lines=[];
          try{
            var raw=localStorage.getItem(key);if(raw===null)return "SLOT "+slot+"\n  v4: なし（v3は隔離）";
            var record=JSON.parse(raw);
            lines.push("  state="+record.state+" schema="+record.schemaVersion+" gen="+record.generation+" chars="+raw.length);
            lines.push("  最初: "+record.generationCreatedAtUtc+" build="+record.generationCreatedByBuildId+" reason="+record.generationCreatedReason);
            ["currentJson","backupJson"].forEach(function(kind){
              if(!record[kind]){lines.push("  "+kind+": なし");return;}
              var env=JSON.parse(record[kind]),payload=JSON.parse(env.payloadJson),day=payload.progress?payload.progress.gameDay:"?";
              var members=payload.roster&&Array.isArray(payload.roster.confirmedRecruitNames)?payload.roster.confirmedRecruitNames.length:"?";
              var name=payload.profile&&payload.profile.playerName?String(payload.profile.playerName):"";
              var masked=name?name.slice(0,1)+"***":"未設定";
              lines.push("  "+kind+": 最終="+env.savedAtUtc+" build="+env.buildId+" reason="+env.writeReason+" rev="+env.revision+" day="+day+" 仲間="+members+" 名前="+masked+" checksum="+(env.checksum?"あり（Unity検証対象）":"なし"));
            });
          }catch(e){lines.push("  v4: あり 解析失敗 "+cut(e,300));}
          return "SLOT "+slot+"\n"+lines.join("\n");
        }
        function audioState(){
          try{
            var context=typeof WEBAudio!=="undefined"?WEBAudio.audioContext:null;
            return context?"Audio: rate="+context.sampleRate+" state="+context.state:"Audio: 未初期化";
          }catch(ignore){return "Audio: 取得失敗";}
        }
        function report(){
          try{
            var text=["SlamFive Web診断","Build: "+BUILD_ID,"URL: "+location.href,"端末: "+navigator.userAgent,"Phase: "+phase,"Last error: "+lastError,audioState(),inspectSlot(1),inspectSlot(2),inspectSlot(3),"Events:",events.join("\n")].join("\n");
            var node=document.getElementById("sf-diag-text");if(node)node.textContent=cut(text,64000);return cut(text,64000);
          }catch(e){return "診断表示失敗: "+String(e);}
        }
        function mark(next,detail){try{phase=next;events.push(new Date().toISOString()+" "+next+(detail?" | "+cut(detail,4096):""));if(events.length>200)events.shift();report();}catch(ignore){}}
        function capture(value,where){try{lastError=where+": "+errorText(value);mark("ERROR "+where,lastError);}catch(ignore){}}
        window.SlamFiveDiagnostics={mark:mark,capture:capture,report:report};
        window.addEventListener("error",function(e){capture(e.error||e.message,"window.error "+(e.filename||"")+":"+(e.lineno||0));},true);
        window.addEventListener("unhandledrejection",function(e){capture(e.reason,"unhandledrejection");},true);
        document.addEventListener("DOMContentLoaded",function(){
          try{
            var button=document.getElementById("sf-diag-button"),panel=document.getElementById("sf-diag-panel");
            button.onclick=function(){report();panel.style.display="block";};
            document.getElementById("sf-diag-close").onclick=function(){panel.style.display="none";};
            document.getElementById("sf-diag-copy").onclick=function(){var text=report();if(navigator.clipboard)navigator.clipboard.writeText(text).catch(function(){});};
            report();
          }catch(ignore){}
        });
      })();
    </script>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">SlamFive</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var buildVersion = "20260911121451";
      var loaderUrl = buildUrl + "/WebGL.loader.js?v=" + buildVersion;
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGL.data.unityweb?v=" + buildVersion,
        frameworkUrl: buildUrl + "/WebGL.framework.js.unityweb?v=" + buildVersion,
        codeUrl: buildUrl + "/WebGL.wasm.unityweb?v=" + buildVersion,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "SlamFive",
        productVersion: "20260911121451",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      SlamFiveDiagnostics.mark("loader requested", loaderUrl);
      script.onload = () => {
        SlamFiveDiagnostics.mark("loader loaded");
        SlamFiveDiagnostics.mark("createUnityInstance started");
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => {
                SlamFiveDiagnostics.mark("Unity started");
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                SlamFiveDiagnostics.capture(message, "createUnityInstance.catch");
                document.querySelector("#sf-diag-panel").style.display = "block";
              });
            };

      script.onerror = (event) => { SlamFiveDiagnostics.capture(event, "loader script error"); document.querySelector("#sf-diag-panel").style.display = "block"; };
      document.body.appendChild(script);

    </script>
  </body>
</html>
